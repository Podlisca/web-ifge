{{/* Banner für STARTSEITE */}}

{{ $image  := .Get "image" }}
{{ $focus  := .Get "focus" | default "center" }}

<div class="start-banner">
    <img src="{{ $image }}"
         alt="Banner"
         style="object-position:{{ $focus }};">
</div>

<style>
.start-banner {
    width: 100%;
    height: 460px;        /* Desktop */
    overflow: hidden;
}

.start-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Handy */
@media (max-width: 768px) {
    .start-banner {
        height: 260px;
    }
}
</style>
